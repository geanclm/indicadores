<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel Indicadores - Sistema Corporativo de Indicadores Macroeconômicos">
    <title>Login | Projeto Indicadores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://geanclm.github.io/indicadores/css/styles.css">

</head>
<body>
    <main class="login-container">
        <section class="login-card" aria-labelledby="login-title">
            
            <header class="login-header">
                <div class="brand-logo">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <h1 id="login-title">Projeto Indicadores</h1>
                <p class="brand-subtitle">Plataforma de Inteligência Macroeconômica</p>
            </header>

            <div id="toast-message" class="toast hidden" role="alert" aria-live="assertive"></div>

            <form id="login-form" novalidate>
                
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Informe seu usuário" 
                            autocomplete="username"
                            required
                        >
                    </div>
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Informe sua senha" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="toggle-password" class="btn-toggle-password" aria-label="Mostrar ou ocultar senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <span class="checkmark"></span>
                        <span class="label-text">Lembrar-me</span>
                    </label>
                    <a href="#" id="forgot-password-link" class="forgot-link">Esqueci minha senha</a>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-submit" class="btn btn-primary">
                        <span class="btn-text">Entrar</span>
                        <i class="fa-solid fa-arrow-right-to-bracket btn-icon"></i>
                        <div class="spinner hidden"></div>
                    </button>
                    
                    <button type="button" id="btn-clear" class="btn btn-secondary">
                        <i class="fa-solid fa-eraser"></i> Limpar
                    </button>
                </div>
            </form>

            <footer class="login-footer">
                <p>&copy; 2026 Projeto Indicadores · Painel Corporativo</p>
            </footer>
        </section>
    </main>
    <script src="https://geanclm.github.io/indicadores/js/script.js"></script>
</body>
</html>
