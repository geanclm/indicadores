<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Projeto Indicadores</title>

    <meta name="description"
        content="Projeto Indicadores - Plataforma Corporativa de Inteligência Macroeconômica">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./css/styles.css">

</head>

<body>

    <!-- Fundo -->
    <div class="background-overlay"></div>

    <main class="login-container">

        <section class="login-card">

            <header class="login-header">

                <div class="brand-logo">

                    <i class="fa-solid fa-chart-line"></i>

                </div>

                <h1>Projeto Indicadores</h1>

                <p>
                    Plataforma de Inteligência Macroeconômica
                </p>

            </header>

            <div id="toast-message" class="toast hidden"></div>

            <form id="login-form" novalidate>

                <div class="form-group">

                    <label>Usuário</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            id="username"
                            type="text"
                            placeholder="Informe seu usuário"
                            autocomplete="username"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>Senha</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            id="password"
                            type="password"
                            placeholder="Informe sua senha"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="toggle-password"
                            class="btn-toggle-password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="form-options">

                    <label class="checkbox-container">

                        <input type="checkbox">

                        <span class="checkmark"></span>

                        Lembrar-me

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

                <button
                    id="btn-submit"
                    class="btn btn-primary">

                    Entrar

                    <i class="fa-solid fa-arrow-right-to-bracket"></i>

                </button>

                <button
                    type="button"
                    id="btn-clear"
                    class="btn btn-secondary">

                    <i class="fa-solid fa-eraser"></i>

                    Limpar

                </button>

            </form>

            <footer>

                © 2026 Projeto Indicadores

            </footer>

        </section>

    </main>

    <script src="./js/scripts.js"></script>

</body>

</html>
